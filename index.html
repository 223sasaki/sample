<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .score-label { color: #888; }
    .score-value { color: #4ecca3; font-weight: bold; font-size: 1.2rem; }

    #canvas {
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
      background: #111122;
    }

    #message {
      margin-top: 16px;
      font-size: 1rem;
      color: #aaa;
      text-align: center;
      min-height: 24px;
    }

    #start-btn {
      margin-top: 12px;
      padding: 10px 30px;
      background: #4ecca3;
      color: #0f0f1a;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    #start-btn:hover { background: #38b48b; }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    <div>
      <span class="score-label">SCORE </span>
      <span class="score-value" id="score">0</span>
    </div>
    <div>
      <span class="score-label">BEST </span>
      <span class="score-value" id="best">0</span>
    </div>
    <div>
      <span class="score-label">LEVEL </span>
      <span class="score-value" id="level">1</span>
    </div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div id="message">スペースキー または ボタンでスタート</div>
  <button id="start-btn">START</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, best, level, speed, gameLoop, running, paused;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 150;
      running = true;
      paused = false;
      best = parseInt(localStorage.getItem('snakeBest') || '0');
      updateUI();
      placeFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
      document.getElementById('message').textContent = '← → ↑ ↓ で操作 | P で一時停止';
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      if (!running || paused) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        if (score > best) {
          best = score;
          localStorage.setItem('snakeBest', best);
        }
        const newLevel = Math.floor(score / 100) + 1;
        if (newLevel !== level) {
          level = newLevel;
          speed = Math.max(60, 150 - (level - 1) * 15);
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, speed);
        }
        placeFood();
        updateUI();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      drawGameOver();
      document.getElementById('message').textContent = 'スペースキー または ボタンでリスタート';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
      }

      // Food — glowing circle
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL / 2);
      grd.addColorStop(0, '#ff6b6b');
      grd.addColorStop(1, 'rgba(255,107,107,0)');
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ff6b6b';
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const alpha = 1 - (i / snake.length) * 0.5;
        const r = CELL / 2 - 1;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.fillStyle = i === 0
          ? `rgba(78, 204, 163, ${alpha})`
          : `rgba(50, 170, 130, ${alpha})`;
        ctx.fill();

        // Eyes on head
        if (i === 0) {
          const ex = dir.y !== 0 ? (dir.y === 1 ? [4, 12] : [4, 12]) : (dir.x === 1 ? [12, 12] : [4, 4]);
          const ey = dir.x !== 0 ? [4, 12] : (dir.y === 1 ? [12, 12] : [4, 4]);
          [[ex[0], ey[0]], [ex[1], ey[1]]].forEach(([ox, oy]) => {
            ctx.beginPath();
            ctx.arc(seg.x * CELL + ox + (dir.x === 1 ? 2 : 0), seg.y * CELL + oy + (dir.y === 1 ? 2 : 0), 2, 0, Math.PI * 2);
            ctx.fillStyle = '#0f0f1a';
            ctx.fill();
          });
        }
      });
    }

    function drawGameOver() {
      draw();
      ctx.fillStyle = 'rgba(15, 15, 26, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 36px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#4ecca3';
      ctx.font = '20px Segoe UI';
      ctx.fillText(`スコア: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
      document.getElementById('level').textContent = level;
    }

    function drawStart() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(78, 204, 163, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#4ecca3';
      ctx.font = 'bold 28px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('SNAKE', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#888';
      ctx.font = '16px Segoe UI';
      ctx.fillText('Press SPACE or START', canvas.width / 2, canvas.height / 2 + 24);
    }

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:    { x: 0, y: -1 },
        ArrowDown:  { x: 0, y:  1 },
        ArrowLeft:  { x: -1, y: 0 },
        ArrowRight: { x:  1, y: 0 },
      };
      if (map[e.key]) {
        e.preventDefault();
        const d = map[e.key];
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
      }
      if (e.key === ' ') {
        e.preventDefault();
        if (!running) init();
        else { paused = !paused; document.getElementById('message').textContent = paused ? '一時停止中 — スペースで再開' : '← → ↑ ↓ で操作 | P で一時停止'; }
      }
      if (e.key === 'p' || e.key === 'P') {
        if (running) { paused = !paused; document.getElementById('message').textContent = paused ? '一時停止中 — P で再開' : '← → ↑ ↓ で操作 | P で一時停止'; }
      }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      if (!running) init();
      else { paused = !paused; document.getElementById('message').textContent = paused ? '一時停止中' : '← → ↑ ↓ で操作 | P で一時停止'; }
    });

    best = parseInt(localStorage.getItem('snakeBest') || '0');
    updateUI();
    running = false;
    drawStart();
  </script>
</body>
</html>
